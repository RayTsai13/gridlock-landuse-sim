[tool.pytest.ini_options]
# The backend loads HEATMAP_GEOJSON at import time. Its default is anchored to
# the repository root, and pinning pytest's rootdir here also keeps package
# imports and test discovery stable when pytest is launched from elsewhere.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["backend/tests", "data_processing/tests"]
