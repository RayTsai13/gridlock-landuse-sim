services:
  frontend:
    image: gridlock-frontend:${GRIDLOCK_TAG:-local}
    build:
      context: .
      dockerfile: frontend.Dockerfile
    depends_on:
      - backend
    expose:
      - "80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6

  backend:
    environment:
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-1800}
      SESSION_LIMIT: ${SESSION_LIMIT:-100}
    image: gridlock-backend:${GRIDLOCK_TAG:-local}
    build:
      context: .
      dockerfile: backend.Dockerfile
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  caddy_data:
  caddy_config:
